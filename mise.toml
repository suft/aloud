[tools]
rust = { version = "1.99", components = "clippy,rustfmt" }
bun = "1.4"
cmake = "4"
"github:EmbarkStudios/cargo-about" = "0.9.3"

[env]
PIPER_ESPEAKNG_DATA_DIRECTORY = "{{config_root}}/src-tauri/resources"

[tasks.setup]
description = "Install JS deps, fetch bundled espeak-ng data and generate the third-party notices"
run = ["bun install", "bun scripts/fetch-espeak.ts", "bun scripts/notices.ts"]

[tasks.notices]
description = "Regenerate src-tauri/resources/THIRD-PARTY-NOTICES.txt (cargo-about + npm licences)"
run = "bun scripts/notices.ts"

[tasks.dev]
run = "bun tauri dev"
depends = ["setup"]

[tasks.build]
run = "bun tauri build"
depends = ["setup"]

# CI sets ALOUD_CARGO_ARGS (see .github/cargo-ci.toml); local runs leave it empty.
[tasks.test]
run = ["cargo test {{ get_env(name='ALOUD_CARGO_ARGS', default='') }} --workspace --exclude aloud", "bun run check"]

[tasks.lint]
run = ["cargo fmt --all --check", "cargo clippy {{ get_env(name='ALOUD_CARGO_ARGS', default='') }} --workspace --all-targets -- -D warnings", "bun run check", "bun run lint"]

[tasks.fmt]
run = ["cargo fmt --all", "bun run format"]

[tasks.models]
run = "bun scripts/fetch-models.ts .dev-data/models"

[tasks.e2e]
run = "cargo run --release -p aloud-core --example aloud -- --data .dev-data --epub .dev-data/alice.epub --chapters 1-2 --out .dev-data/out"
depends = ["models"]

[tasks.smoke]
description = "Render a tiny generated EPUB end to end with the fast model"
run = [
  "bun scripts/smoke.ts .smoke-data",
  "cargo run {{ get_env(name='ALOUD_CARGO_ARGS', default='') }} -p aloud-core --example aloud -- --data .smoke-data --epub .smoke-data/smoke.epub --model fast --out .smoke-data/out",
]

[tasks.screenshots]
description = "Regenerate the README screenshots in docs/screenshots/"
run = ["bun x playwright install --only-shell chromium", "bun scripts/screenshots/capture.ts"]

[tasks.icons]
run = "bun tauri icon assets/icon.svg"
