[workspace]
resolver = "3"
members = ["crates/aloud-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["suft"]

[workspace.dependencies]
ort = { version = "=2.0.0-rc.15" }
misaki-rs = "0.8"
rusty_aac = "2"
mp4 = "0.14"
mp4ameta = "0.13"
ebur128 = "0.1"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
scraper = "0.23"
regex = "1"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots", "rustls-tls-native-roots", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
ts-rs = { version = "12", features = ["no-serde-warnings"] }
sha2 = "0.10"
num_cpus = "1"
keepawake = "0.5"
thiserror = "2"
tracing = { version = "0.1", features = ["log"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
