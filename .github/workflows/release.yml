name: Release

on:
  push:
    tags: ["v*"]

# Every job asks for what it needs. Only `publish` and `finalize` can write to the repository.
permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the version in Cargo.toml
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      - name: Check CHANGELOG.md has notes for this version
        run: bash scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

  # Builds run with a read-only token and the signing key; they only upload artifacts.
  build:
    needs: [version, ci]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # ort's prebuilt ONNX Runtime needs glibc >= 2.38 / GCC 13, so Linux builds run on 24.04 (glibc 2.39),
          # which is also the minimum glibc for the AppImage and .deb.
          - os: ubuntu-24.04
            args: ""
            bundle: target/release/bundle
          - os: windows-latest
            args: ""
            bundle: target/release/bundle
          # ONNX Runtime has no prebuilt for Intel Macs, so macOS ships for Apple Silicon only.
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
            bundle: target/aarch64-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # `bun tauri build` runs outside mise, so it can't rely on mise exporting this.
      ORT_CACHE_DIR: ${{ github.workspace }}/.ort-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libclang-dev libc++-dev libc++abi-dev build-essential libssl-dev
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # cmake-rs bakes the cmake binary path into build dirs; a toolchain bump must not reuse them.
          key: ${{ hashFiles('mise.toml') }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ort-cache
          key: onnxruntime-1.31.0-${{ runner.os }}-${{ hashFiles('scripts/fetch-onnxruntime.ts') }}
      - run: mise run setup
      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun tauri build --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.os }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle }}/appimage/*.AppImage
            ${{ matrix.bundle }}/appimage/*.AppImage.sig
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/nsis/*-setup.exe
            ${{ matrix.bundle }}/nsis/*-setup.exe.sig
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/msi/*.msi.sig
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/macos/*.app.tar.gz
            ${{ matrix.bundle }}/macos/*.app.tar.gz.sig

  # The only job that creates the release; it never runs project code.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: bundles
      - name: Create the draft release and latest.json
        run: bash scripts/publish-release.sh

  finalize:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release assets
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" --dir assets
      - name: Check every platform uploaded its assets
        run: |
          v="${TAG#v}"
          missing=0
          for f in "Aloud_${v}_amd64.AppImage" "Aloud_${v}_amd64.AppImage.sig" "Aloud_${v}_amd64.deb" \
                   "Aloud_${v}_x64-setup.exe" "Aloud_${v}_x64-setup.exe.sig" \
                   "Aloud_${v}_x64_en-US.msi" "Aloud_${v}_x64_en-US.msi.sig" \
                   "Aloud_${v}_aarch64.dmg" "Aloud_${v}_aarch64.app.tar.gz" "Aloud_${v}_aarch64.app.tar.gz.sig" \
                   "latest.json"; do
            [ -f "assets/$f" ] || { echo "::error::Missing release asset $f"; missing=1; }
          done
          for p in linux-x86_64 windows-x86_64 darwin-aarch64; do
            jq -e --arg p "$p" '.platforms[$p].url and .platforms[$p].signature' assets/latest.json >/dev/null \
              || { echo "::error::latest.json has no $p entry"; missing=1; }
          done
          exit $missing
      - name: Upload SHA256SUMS
        run: |
          (cd assets && sha256sum -- *) > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: aloud-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM
        run: gh release upload "$TAG" "aloud-$TAG.spdx.json" --clobber -R "$GITHUB_REPOSITORY"
