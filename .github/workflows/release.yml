name: Release

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the version in Cargo.toml
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

  release:
    needs: [version, ci]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ort's prebuilt ONNX Runtime is built against glibc >= 2.38 / GCC 13 and fails to link on 22.04.
          - os: ubuntu-24.04
            args: ""
          - os: windows-latest
            args: ""
          # ONNX Runtime has no prebuilt for Intel Macs, so macOS ships for Apple Silicon only.
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libclang-dev libc++-dev libc++abi-dev build-essential libssl-dev
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          # cmake-rs bakes the cmake binary path into build dirs; a toolchain bump must not reuse them.
          key: ${{ hashFiles('mise.toml') }}
      - run: mise run setup
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Aloud ${{ github.ref_name }}"
          releaseDraft: true
          updaterJsonPreferNsis: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  finalize:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Download release assets
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" --dir assets
      - name: Check every platform uploaded its assets
        run: |
          v="${TAG#v}"
          missing=0
          for f in "Aloud_${v}_amd64.AppImage" "Aloud_${v}_amd64.AppImage.sig" "Aloud_${v}_amd64.deb" \
                   "Aloud_${v}_x64-setup.exe" "Aloud_${v}_x64-setup.exe.sig" \
                   "Aloud_${v}_x64_en-US.msi" "Aloud_${v}_x64_en-US.msi.sig" \
                   "Aloud_${v}_aarch64.dmg" "Aloud_${v}_aarch64.app.tar.gz" "Aloud_${v}_aarch64.app.tar.gz.sig" \
                   "latest.json"; do
            [ -f "assets/$f" ] || { echo "::error::Missing release asset $f"; missing=1; }
          done
          for p in linux-x86_64 windows-x86_64 darwin-aarch64; do
            jq -e --arg p "$p" '.platforms[$p].url and .platforms[$p].signature' assets/latest.json >/dev/null \
              || { echo "::error::latest.json has no $p entry"; missing=1; }
          done
          exit $missing
      - name: Upload SHA256SUMS
        run: |
          (cd assets && sha256sum -- *) > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: SHA256SUMS
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: aloud-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM
        run: gh release upload "$TAG" "aloud-$TAG.spdx.json" --clobber -R "$GITHUB_REPOSITORY"
