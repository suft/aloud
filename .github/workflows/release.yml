name: Release

on:
  push:
    tags: ["v*"]

# Every job asks for what it needs. Only `publish` and `finalize` can write to the repository.
permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the tag matches the version in Cargo.toml
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      - name: Check CHANGELOG.md has notes for this version
        run: bash scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

  # Builds run with a read-only token and the signing key; they only upload artifacts.
  build:
    needs: [version, ci]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # ort's prebuilt ONNX Runtime needs glibc >= 2.38 / GCC 13, so Linux builds run on 24.04 (glibc 2.39),
          # which is also the minimum glibc for the AppImage and .deb.
          - os: ubuntu-24.04
            args: ""
            bundle: target/release/bundle
          - os: windows-latest
            args: ""
            bundle: target/release/bundle
          # ONNX Runtime has no prebuilt for Intel Macs, so macOS ships for Apple Silicon only.
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
            bundle: target/aarch64-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # `bun tauri build` runs outside mise, so it can't rely on mise exporting this.
      ORT_CACHE_DIR: ${{ github.workspace }}/.ort-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install system packages (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libclang-dev libc++-dev libc++abi-dev build-essential libssl-dev
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          # cmake-rs bakes the cmake binary path into build dirs; a toolchain bump must not reuse them.
          key: ${{ hashFiles('mise.toml', 'mise.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v6
        with:
          path: .ort-cache
          key: onnxruntime-1.31.0-${{ runner.os }}-${{ hashFiles('scripts/fetch-onnxruntime.ts') }}
      - run: mise run setup
      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing and notarization (CONTRIBUTING.md); exported below only when all six are set.
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            names="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"
            count=0
            for n in $names; do s="SECRET_$n"; if [ -n "${!s}" ]; then count=$((count + 1)); fi; done
            if [ "$count" -eq 6 ]; then
              for n in $names; do s="SECRET_$n"; export "$n=${!s}"; done
              echo "APPLE_SIGNED=true" >> "$GITHUB_ENV"
            elif [ "$count" -ne 0 ]; then
              echo "::error::Set all six APPLE_* signing secrets or none (see CONTRIBUTING.md)"
              exit 1
            fi
          fi
          bun tauri build --config src-tauri/tauri.release.conf.json ${{ matrix.args }} -- --locked
      - name: Check the macOS signature
        if: env.APPLE_SIGNED == 'true'
        run: |
          app="${{ matrix.bundle }}/macos/Aloud.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle }}/appimage/*.AppImage
            ${{ matrix.bundle }}/appimage/*.AppImage.sig
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/nsis/*-setup.exe
            ${{ matrix.bundle }}/nsis/*-setup.exe.sig
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/msi/*.msi.sig
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/macos/*.app.tar.gz
            ${{ matrix.bundle }}/macos/*.app.tar.gz.sig

  # The only job that creates the release; it never runs project code.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: bundles
      - name: Create the draft release and latest.json
        run: bash scripts/publish-release.sh

  finalize:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download release assets
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" --dir release-assets
      - name: Check every platform uploaded its assets
        run: |
          v="${TAG#v}"
          missing=0
          for f in "Aloud_${v}_amd64.AppImage" "Aloud_${v}_amd64.AppImage.sig" "Aloud_${v}_amd64.deb" \
                   "Aloud_${v}_x64-setup.exe" "Aloud_${v}_x64-setup.exe.sig" \
                   "Aloud_${v}_x64_en-US.msi" "Aloud_${v}_x64_en-US.msi.sig" \
                   "Aloud_${v}_aarch64.dmg" "Aloud_${v}_aarch64.app.tar.gz" "Aloud_${v}_aarch64.app.tar.gz.sig" \
                   "latest.json"; do
            [ -f "release-assets/$f" ] || { echo "::error::Missing release asset $f"; missing=1; }
          done
          for p in linux-x86_64 windows-x86_64 darwin-aarch64; do
            jq -e --arg p "$p" '.platforms[$p].url and .platforms[$p].signature' release-assets/latest.json >/dev/null \
              || { echo "::error::latest.json has no $p entry"; missing=1; }
          done
          exit $missing
      - name: Upload SHA256SUMS
        run: |
          (cd release-assets && sha256sum -- *) > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: SHA256SUMS
      - uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: aloud-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM
        run: gh release upload "$TAG" "aloud-$TAG.spdx.json" --clobber -R "$GITHUB_REPOSITORY"
