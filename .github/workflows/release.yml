name: Release

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ort's prebuilt ONNX Runtime is built against glibc >= 2.38 / GCC 13 and fails to link on 22.04.
          - os: ubuntu-24.04
            args: ""
          - os: windows-latest
            args: ""
          # ONNX Runtime has no prebuilt for Intel Macs, so macOS ships for Apple Silicon only.
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libclang-dev libc++-dev libc++abi-dev build-essential libssl-dev
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          # cmake-rs bakes the cmake binary path into build dirs; a toolchain bump must not reuse them.
          key: ${{ hashFiles('mise.toml') }}
      - run: mise run setup
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Aloud ${{ github.ref_name }}"
          releaseDraft: true
